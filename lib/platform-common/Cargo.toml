[package]
name = "platform-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"

[dependencies]
anyhow = "1.0.102"
async-nats = "0.46.0"
axum = "0.8.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1.50.0", features = ["sync", "time", "fs", "io-util"] }
tonic = "0.12"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt", "net", "test-util"] }
