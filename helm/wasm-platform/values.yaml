wpOperator:
  image:
    repository: wasm-platform-registry.localhost:5001/wp-operator
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicaCount: 1
  grpc:
    port: 50051

executionHost:
  image:
    repository: wasm-platform-registry.localhost:5001/execution-host
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  replicaCount: 1
  wasmMemoryLimitMb: 64
  # wasmFuelLimit: 500000000  # Optional: set to enable fuel metering (max WASM instructions per invocation). Unset disables fuel metering.
  configSync:
    serverAddr: "http://wp-operator-grpc:50051"
  moduleCache:
    addr: "http://module-cache:80"
  logLevel: info

gateway:
  image:
    repository: wasm-platform-registry.localhost:5001/gateway
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  replicaCount: 1
  nats:
    secretName: gateway-nats-credentials
  operator:
    addr: "http://wp-operator-grpc:50051"
  gateway:
    timeoutSecs: 30
    httpPort: 3000
  ingress:
    enabled: true
    host: ""
  logLevel: info

moduleCache:
  image:
    repository: wasm-platform-registry.localhost:5001/module-cache
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  replicaCount: 1
  logLevel: info

# databases configures the resource sizes and versions that the wp-operator uses
# when it provisions infrastructure CRs (NatsCluster, PostgresDatabase, RedisDatabase)
# in response to Application lifecycle events.
# The operator manages the full lifecycle of these CRs; no database CRs are
# provisioned by the Helm chart itself.
databases:
  postgres:
    version: "16"
    storageSize: 1Gi
  redis:
    storageSize: 1Gi
  nats:
    version: "2.10"
    jetStream:
      storageSize: 1Gi
