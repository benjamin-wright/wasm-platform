apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-host
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wasm-platform.execution-host.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.executionHost.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-host
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: ambient
        {{- include "wasm-platform.execution-host.labels" . | nindent 8 }}
      {{- include "wasm-platform.artifact-dns.annotations" . | nindent 6 }}
    spec:
      serviceAccountName: execution-host
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: execution-host
          image: "{{ .Values.executionHost.image.repository }}:{{ .Values.executionHost.image.tag }}"
          imagePullPolicy: {{ .Values.executionHost.image.pullPolicy }}
          env:
            - name: APPROVED_REGISTRIES
              value: {{ join "," .Values.artifacts.approvedRegistries | quote }}
            - name: LOCAL_PLAINTEXT_REGISTRIES
              value: {{ join "," .Values.artifacts.localPlaintextRegistries | quote }}
            - name: MODULE_CACHE_ADDR
              value: {{ .Values.executionHost.moduleCache.addr | quote }}
            - name: CONFIG_SYNC_ADDR
              value: {{ .Values.executionHost.configSync.serverAddr | quote }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: {{ .Values.executionHost.logLevel | quote }}
            - name: WASM_MEMORY_LIMIT_MB
              value: "{{ .Values.executionHost.wasmMemoryLimitMb }}"
            - name: NATS_CREDENTIALS_PATH
              value: /etc/nats-credentials
            {{- if .Values.executionHost.wasmFuelLimit }}
            - name: WASM_FUEL_LIMIT
              value: "{{ .Values.executionHost.wasmFuelLimit }}"
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.executionHost.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{- include "wasm-platform.identity.mount" . | nindent 12 }}
            - name: nats-credentials
              mountPath: /etc/nats-credentials
              readOnly: true
      volumes:
        {{- include "wasm-platform.identity.volume" . | nindent 8 }}
        - name: nats-credentials
          secret:
            secretName: execution-host-nats-credentials
