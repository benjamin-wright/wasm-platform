apiVersion: v1
kind: ServiceAccount
metadata:
  name: module-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wasm-platform.module-cache.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-module-cache
  labels:
    {{- include "wasm-platform.module-cache.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-module-cache
  labels:
    {{- include "wasm-platform.module-cache.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-module-cache
subjects:
  - kind: ServiceAccount
    name: module-cache
    namespace: {{ .Release.Namespace }}
