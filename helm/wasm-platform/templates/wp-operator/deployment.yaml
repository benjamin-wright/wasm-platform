apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wasm-platform.wp-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.wpOperator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: wp-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "wasm-platform.wp-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: wp-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wp-operator
          image: "{{ .Values.wpOperator.image.repository }}:{{ .Values.wpOperator.image.tag }}"
          imagePullPolicy: {{ .Values.wpOperator.image.pullPolicy }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --webhook-cert-dir=/etc/webhook/certs
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GRPC_PORT
              value: {{ .Values.wpOperator.grpc.port | quote }}
            - name: POSTGRES_DATABASE_NAME
              value: {{ include "wasm-platform.postgresDatabaseName" . | quote }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.wpOperator.grpc.port }}
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.wpOperator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: wp-operator-webhook-tls
