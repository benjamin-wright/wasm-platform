apiVersion: v1
kind: Service
metadata:
  name: wp-operator-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wasm-platform.wp-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wp-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: webhook
      port: 9443
      targetPort: webhook
      protocol: TCP
