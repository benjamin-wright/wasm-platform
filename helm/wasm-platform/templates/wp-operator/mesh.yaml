apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: wp-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wasm-platform.wp-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wp-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  mtls:
    mode: PERMISSIVE
  portLevelMtls:
    {{ .Values.wpOperator.grpc.port }}:
      mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: wp-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wasm-platform.wp-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wp-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: ALLOW
  rules:
    - from:
        - source:
            serviceAccounts:
              - {{ printf "%s/execution-host" .Release.Namespace | quote }}
              - {{ printf "%s/gateway" .Release.Namespace | quote }}
      to:
        - operation:
            ports: [{{ .Values.wpOperator.grpc.port | quote }}]
    - to:
        - operation:
            ports: ["8080", "8081", "9443"]
