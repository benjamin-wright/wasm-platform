apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: wasm-platform-selfsigned
  labels:
    {{- include "wasm-platform.wp-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wp-operator-webhook-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wasm-platform.wp-operator.labels" . | nindent 4 }}
spec:
  secretName: wp-operator-webhook-tls
  issuerRef:
    name: wasm-platform-selfsigned
    kind: ClusterIssuer
  dnsNames:
    - wp-operator-webhook.{{ .Release.Namespace }}.svc
    - wp-operator-webhook.{{ .Release.Namespace }}.svc.cluster.local
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: wasm-platform-application-validator
  labels:
    {{- include "wasm-platform.wp-operator.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/wp-operator-webhook-tls
webhooks:
  - name: vapplication.wasm-platform.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    rules:
      - apiGroups: ["wasm-platform.io"]
        apiVersions: ["v1alpha1"]
        resources: ["applications"]
        operations: ["CREATE", "UPDATE"]
    clientConfig:
      service:
        name: wp-operator-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-wasm-platform-io-v1alpha1-application
        port: 9443
