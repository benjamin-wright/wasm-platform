{{- if .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wasm-platform.gateway.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.gateway.ingress.host | default "" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
{{- end }}
