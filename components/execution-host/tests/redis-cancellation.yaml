apiVersion: v1
kind: Namespace
metadata:
  name: wasm-cancellation-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cancellation
  namespace: wasm-cancellation-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cancellation
  template:
    metadata:
      labels:
        app: redis-cancellation
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["--save", "", "--appendonly", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
